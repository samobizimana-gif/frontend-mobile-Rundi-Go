name: rundi_go
description: "RundiGo App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  flutter_tts: ^4.0.2
  shared_preferences: ^2.3.0
  web_socket_channel: ^3.0.1
  image_picker: 1.2.3
  url_launcher: ^6.3.1
  record: ^6.1.1
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  http_parser: ^4.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.10
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#B0DBB0"
  adaptive_icon_foreground: "assets/logo.png"